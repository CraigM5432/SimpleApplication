version: 2.1

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main

jobs:
  build:
    working_directory: ~/SimpleApplication
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install dependencies
          command: npm install
      - run:
          name: run tests
          command: npm test
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

  deploy:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: deploy application to ec2
          command: |
            ssh -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_PUBLIC_DNS "
              export PRIVATE_KEY_B64='$PRIVATE_KEY_B64' &&
              export SERVER_B64='$SERVER_B64' &&
              rm -rf ~/SimpleApplication &&
              git clone $REPO_URL ~/SimpleApplication &&
              cd ~/SimpleApplication &&
              chmod +x deploy.sh &&
              ./deploy.sh
            "
